  <text x="96" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#141118">94% nie przeszło.</text>
  <text x="96" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="72" font-weight="700" fill="#6f6875">6% przeszło.</text>
  <text x="96" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="34" fill="#6f6875">939 indyjskich marek. Pięć branż.</text>
  <text x="96" y="606" font-family="Liberation Sans, Arial, sans-serif" font-size="34" fill="#6f6875">Lipiec 2026.</text>
  <rect x="96" y="690" width="888" height="72" rx="36" fill="#e6dfd4"/>
  <rect x="96" y="690" width="835" height="72" rx="36" fill="url(#brand)"/>
  <text x="96" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#141118">94% nie przeszło</text>
  <text x="984" y="820" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#6f6875">6% przeszło</text>
  <text x="96" y="960" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#141118">Powód z artykułu: strony były</text>
  <text x="96" y="1012" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#141118">trudne do odczytania dla botów.</text>
  <text x="96" y="1110" font-family="Liberation Sans, Arial, sans-serif" font-size="28" fill="#6f6875">Źródło: Storyboard18, 18.11.2026</text>
