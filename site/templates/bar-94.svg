<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
  <title>94% nie przeszło, 6% przeszło</title>
  
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e09034"/>
      <stop offset="1" stop-color="#804ad8"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
            <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
          </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#f7f3ec"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".55"/>
  
  <g transform="translate(96 96) scale(1.1666666666666667)">
    <path d="M35.31 12.69A16 16 0 1 0 39.04 29.47L26.5 29.47"
