<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
  <title>Jeśli AI nie potrafi przeczytać Twojej strony, nie poleci Cię</title>
  
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e09034"/>
      <stop offset="1" stop-color="#804ad8"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
            <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
          </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#f7f3ec"/>
  <rect width="1080" height="1350" fill="url(#grid)" opacity=".55"/>
  <circle cx="920" cy="180" r="360" fill="none" stroke="url(#brand)" stroke-opacity=".22" stroke-width="2"/>
  
  <g transform="translate(96 96) scale(1.1666666666666667)">
    <path d="M35.31 12.69A16 16 0 1 0 39.04 29.47L26.5 29.47"
      fill="none" stroke="url(#brand)" stroke-width="5.5"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29.5" cy="20" r="4" fill="url(#brand)"/>
  </g>
  <text x="168" y="136.32" font-family="Liberation Sans, Arial, sans-serif"
    font-size="29.12" font-weight="700" letter-spacing="-1"
    fill="#141118">GEORate</text>
  <text x="96" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="26"
    font-weight="700" letter-spacing="5"
    fill="#804ad8">STANOWISKO GEORATE</text>
  <text x="96" y="500" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" fill="#141118">Jeśli AI nie</text>
  <text x="96" y="610" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" fill="#141118">potrafi przeczytać</text>
  <text x="96" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" fill="#141118">Twojej strony,</text>
  <text x="96" y="830" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" fill="url(#brand)">nie poleci Cię.</text>
  <text x="96" y="990" font-family="Liberation Sans, Arial, sans-serif" font-size="30" fill="#6f6875">Z benchmarku 939 marek.</text>
  <text x="96" y="1262" font-family="Liberation Sans, Arial, sans-serif" font-size="24"
    fill="#6f6875">georate.ai/check</text>
</svg>